<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="브라우저에서 바로 실행하는 미니 웹 도구 모음.">
  <title>Mini Tools — MikeShin0822</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
    *{box-sizing:border-box} body{margin:0;background:#f8f9fc;color:#1b2438}
    main{max-width:850px;margin:0 auto;padding:68px 24px 100px}
    .eyebrow{font-size:12px;font-weight:700;color:#546ddb;letter-spacing:.14em;text-transform:uppercase}
    h1{font-size:clamp(29px,5vw,46px);line-height:1.15;letter-spacing:-.045em;margin:16px 0}
    p{color:#687389;line-height:1.75}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:34px}
    a.card{display:block;border:1px solid #e3e7f0;border-radius:18px;padding:28px;background:#fff;text-decoration:none;color:inherit;box-shadow:0 12px 30px rgba(20,38,70,.04);transition:transform .2s,box-shadow .2s}
    a.card:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(20,38,70,.10)}
    .tag{display:inline-block;border-radius:99px;background:#eff2ff;color:#486ad6;padding:6px 11px;font-size:12px;font-weight:700}
    h2{font-size:21px;margin:18px 0 10px;letter-spacing:-.025em}
    .arrow{color:#486ad6;font-weight:700;display:inline-block;margin-top:15px;font-size:14px}
    footer{margin-top:36px;font-size:12px;color:#93a0b6}
    a:focus-visible{outline:3px solid #486ad6;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Interactive tools</div>
    <h1>작은 도구, 새로운 관점.</h1>
    <p>설치하지 않고 브라우저에서 바로 실행하는 인터랙티브 웹 도구 모음입니다.</p>
    <div class="grid">
      <a class="card" href="./bayesian-sensor/">
        <span class="tag">확률 · 판단</span>
        <h2>Bayes Lens — 베이지안 센서</h2>
        <p>사전확률과 새로운 증거를 조합해 판단이 어떻게 달라지는지 시각적으로 탐색해 보세요.</p>
        <span class="arrow">센서 실행하기 →</span>
      </a>
      <a class="card" href="./reddit-english-review/">
        <span class="tag">영어 · 표현</span>
        <h2>Reddit English Review</h2>
        <p>레딧 영어 표현 검토에 활용하는 HTML 자료입니다.</p>
        <span class="arrow">페이지 열기 →</span>
      </a>
    </div>
    <footer>Static HTML · GitHub Pages</footer>
  </main>
</body>
</html>
